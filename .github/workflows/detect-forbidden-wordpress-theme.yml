name: Detect Forbidden WordPress Theme Usage

on:
  pull_request:
    branches: [ main ]

jobs:
  theme-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Copilot Theme Check
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set +e
          output=$(copilot \
            --prompt "Scan the current pull request diff only. Check for WordPress block markup that contains a JSON attribute named \"theme\" with value \"design-system-wordpress-theme\". If any are found, print FORBIDDEN_THEME_FOUND on its own line, then print only the offending added lines. If none are found, print NO_FORBIDDEN_THEME_FOUND on its own line." 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ $status -ne 0 ]; then
            echo "::error title=Theme check tool failed::Copilot CLI failed to run (install/auth/network/runtime issue). See logs above."
            exit 1
          fi

          if printf "%s\n" "$output" | rg -q "^FORBIDDEN_THEME_FOUND$"; then
            echo "::error title=Forbidden WordPress theme detected::Found theme=\"design-system-wordpress-theme\" in this PR diff. Remove or replace it before merging. Offending lines are printed above."
            exit 1
          fi

          if printf "%s\n" "$output" | rg -q "^NO_FORBIDDEN_THEME_FOUND$"; then
            echo "No forbidden WordPress theme usage detected."
            exit 0
          fi

          echo "::error title=Unexpected Copilot output::Copilot did not return an expected sentinel result. See logs above."
          exit 1
