name: Detect Forbidden WordPress Theme Usage

on:
  pull_request:
    branches: [ main ]

jobs:
  theme-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Detect forbidden theme in template parts
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          diff_output=$(git diff --no-color "origin/${{ github.base_ref }}...HEAD")

          prompt=$(cat <<'EOF'
          Analyze ONLY the provided git diff.
          Check ONLY added lines (those that begin with "+").
          Detect WordPress template-part comments that include:
          "theme":"design-system-wordpress-theme"

          Required output format:
          - If any match exists, print exactly:
            FORBIDDEN_THEME_FOUND
            followed by only the offending added lines.
          - If no match exists, print exactly:
            NO_FORBIDDEN_THEME_FOUND
          - Do not print any other text.
          EOF
          )

          set +e
          output=$(copilot --prompt "$prompt

          DIFF START
          $diff_output
          DIFF END" 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ $status -ne 0 ]; then
            echo "::error title=Theme check tool failed::Copilot CLI failed to run (install/auth/network/runtime issue). See logs above."
            exit 1
          fi

          if printf "%s\n" "$output" | rg -q "^FORBIDDEN_THEME_FOUND$"; then
            echo "::error title=Forbidden WordPress theme detected::Found template-part markup using theme \"design-system-wordpress-theme\" in added lines. Remove the theme attribute before merging."
            exit 1
          fi

          if printf "%s\n" "$output" | rg -q "^NO_FORBIDDEN_THEME_FOUND$"; then
            echo "No forbidden WordPress template-part theme usage detected."
            exit 0
          fi

          echo "::error title=Unexpected Copilot output::Copilot did not return expected sentinel output. See logs above."
          exit 1
