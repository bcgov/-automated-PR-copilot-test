name: Detect Forbidden WordPress Theme Usage

on:
  pull_request:
    branches: [ main ]

jobs:
  theme-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff for forbidden WordPress theme attribute
        run: |
          # Ensure the PR base branch ref exists locally.
          git fetch origin "${{ github.base_ref }}" --depth=1
          diff_output=$(git diff --no-color "origin/${{ github.base_ref }}...HEAD")
          matches=$(printf "%s\n" "$diff_output" | rg '^\+.*"theme"\s*:\s*"design-system-wordpress-theme"' || true)

          if [ -n "$matches" ]; then
            echo "::error title=Forbidden WordPress theme detected::Found 'theme:\"design-system-wordpress-theme\"' in added lines. Remove or replace it before merging."
            echo "Offending added lines:"
            echo "$matches"
            exit 1
          fi

          echo "No forbidden WordPress theme usage detected in added lines."
